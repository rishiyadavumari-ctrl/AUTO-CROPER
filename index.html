<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISHI YADAV NM LINK GENERATOR</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .server-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 550px;
            text-align: center;
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 5px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #5f6368;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #3c4043;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #dadce0;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1557b0;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #1a73e8;
            border-radius: 4px;
            text-align: left;
            display: none;
        }
        .link-title {
            font-weight: bold;
            color: #202124;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .generated-link {
            word-break: break-all;
            display: block;
            background: #fff;
            padding: 8px;
            border: 1px solid #e8eaed;
            border-radius: 4px;
            color: #1a73e8;
            text-decoration: none;
            font-family: monospace;
            font-size: 13px;
        }
        .generated-link:hover {
            text-decoration: underline;
        }
        .error {
            color: #d93025;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .footer-credit {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 15px;
            color: #000000;
            background-color: rgba(255,255,255,0.85);
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

<div class="server-container">
    <h1>RISHI YADAV NM LINK GENERATOR</h1>
    <div class="subtitle">Samagra ID Link Generator</div>
    
    <div class="form-group">
        <label for="samagraId">8-Digit Samagra ID Darj Karein:</label>
        <input type="number" id="samagraId" placeholder="Example: 45065800" oninput="javascript: if (this.value.length > 8) this.value = this.value.slice(0, 8);">
        <div id="errorMsg" class="error">Kripya sahi 8-digit ka number daalein!</div>
    </div>
    
    <button onclick="generateLinks()">LINK GENERATE KAREIN</button>
    
    <div id="resultBox" class="result-box">
        <div class="link-title">New Format Link (Register Request):</div>
        <a id="newLink" class="generated-link" href="#" target="_blank"></a>
        
</div>

<script>
function generateLinks() {
    const idInput = document.getElementById('samagraId').value;
    const errorMsg = document.getElementById('errorMsg');
    const resultBox = document.getElementById('resultBox');
    
    // Check validation for exactly 8 digits
    if (idInput.length !== 8) {
        errorMsg.style.display = 'block';
        resultBox.style.display = '';
        return;
    }
    
    errorMsg.style.display = 'none';
    
    // Convert 8 digit string into Base64 (btoa functions handles strings)
    const encodedId = btoa(idInput);
    
    // Generate both requested URL patterns
    const newUrl = `https://samagra.gov.in/Citizen/Pages/RegisterRequestOfNewMembersInExistingFamily_New.aspx?S=1&M=${encodedId}`;
    
    // Display result in UI
    const newLinkElement = document.getElementById('newLink');
    newLinkElement.href = newUrl;
    newLinkElement.innerText = newUrl;
    
    
    resultBox.style.display = 'block';
}
</script>

<div class="footer-credit">Powered by - RISHI YADAV UMRI BHIND MP</div>

</body>
</html>
